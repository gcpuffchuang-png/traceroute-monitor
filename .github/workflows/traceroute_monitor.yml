name: IP Traceroute Monitor Panel

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
    - name: 檢出程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝 Python 依賴套件
      run: |
        pip install requests

    - name: 恢復歷史數據快取 (Baseline, Logs, HTML)
      id: cache-data
      uses: actions/cache@v4
      with:
        path: |
          baseline.json
          index.html
          results.json
          logs/
        key: mtr-panel-data-${{ github.run_id }}
        restore-keys: |
          mtr-panel-data-

    - name: 執行 100% 穿透型 TCP 路由監控
      run: sudo python monitor.py

    - name: 儲存最新數據快取
      if: always()
      uses: actions/cache/save@v4
      with:
        path: |
          baseline.json
          index.html
          results.json
          logs/
        key: mtr-panel-data-${{ github.run_id }}

    - name: 上傳網頁構件
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: 部署至 GitHub Pages
      uses: actions/deploy-pages@v4
