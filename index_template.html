<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internet 路由巡檢儀表板</title>
    <!-- 引入 Tailwind CSS 與 Google 字體 -->
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Lexend', sans-serif; background-color: #0b1329; }
        .ip-mono { font-family: 'Source Code Pro', monospace; }
    </style>
</head>
<body class="text-slate-100 min-h-full pb-12">

    <!-- 頂部導覽列 -->
    <header class="border-b border-slate-800 bg-[#0f1b35]/80 backdrop-blur sticky top-0 z-50 px-6 py-4">
        <div class="max-w-[1600px] mx-auto flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-xl font-bold flex items-center gap-2 text-white">
                    <span class="text-cyan-400">🌐</span> Internet 路由巡檢儀表板
                </h1>
                <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-slate-400 mt-1">
                    <span class="flex items-center gap-1"><span class="text-rose-400">📍</span> 探測節點：TW 台灣本地探針</span>
                    <span class="flex items-center gap-1"><span class="text-cyan-400">⏱️</span> 巡檢週期：每 30 分鐘自動巡檢</span>
                    <span class="flex items-center gap-1"><span class="text-emerald-400">🕒</span> 最後巡檢時間：<span id="txt-update-time">--</span></span>
                </div>
            </div>
            <!-- 頂部右側控制按鈕組 -->
            <div class="flex items-center gap-2 text-xs">
                <button class="px-3 py-2 bg-amber-600/20 text-amber-300 border border-amber-500/30 rounded flex items-center gap-1.5 font-medium cursor-not-allowed">
                    🔕 靜音警報 (無告警)
                </button>
                <button onclick="window.location.reload()" class="px-3 py-2 bg-cyan-600 text-white rounded hover:bg-cyan-500 transition flex items-center gap-1.5 font-medium">
                    🔄 畫面刷新
                </button>
                <button class="px-3 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-500 transition flex items-center gap-1.5 font-medium cursor-not-allowed">
                    ⚡ 自訂單點測試
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-[1600px] mx-auto px-6 mt-6">
        
        <!-- 四欄頂部戰情統計卡片區 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <!-- 卡片 1 -->
            <div class="bg-[#122242] border border-slate-800 rounded-xl p-5 shadow-lg">
                <div class="text-xs font-medium text-slate-400">監控目標總數</div>
                <div class="text-3xl font-bold mt-2 text-white"><span id="card-total">--</span> <span class="text-xs font-normal text-slate-400">組 IP</span></div>
            </div>
            <!-- 卡片 2 -->
            <div class="bg-[#122242] border border-emerald-500/30 rounded-xl p-5 shadow-lg relative overflow-hidden">
                <div class="absolute top-0 right-0 w-24 h-24 bg-emerald-500/5 rounded-full blur-xl -mr-4 -mt-4"></div>
                <div class="text-xs font-medium text-slate-400">國內外全正常 (抵達 BR)</div>
                <div class="text-3xl font-bold mt-2 text-emerald-400"><span id="card-ok">--</span> <span class="text-xs font-normal text-slate-400">組</span></div>
            </div>
            <!-- 卡片 3 -->
            <div class="bg-[#122242] border border-slate-800 rounded-xl p-5 shadow-lg">
                <div class="text-xs font-medium text-slate-400">TW 台灣端異常</div>
                <div class="text-3xl font-bold mt-2 text-slate-300"><span id="card-tw-bad">0</span> <span class="text-xs font-normal text-slate-400">組</span></div>
                <div class="flex gap-2 mt-2 text-[10px]">
                    <span class="px-1.5 py-0.5 bg-rose-500/10 text-rose-300 rounded border border-rose-500/20">未達: 0</span>
                    <span class="px-1.5 py-0.5 bg-amber-500/10 text-amber-300 rounded border border-amber-500/20">私網: 0</span>
                </div>
            </div>
            <!-- 卡片 4 -->
            <div class="bg-[#122242] border border-slate-800 rounded-xl p-5 shadow-lg">
                <div class="text-xs font-medium text-slate-400">JP 境外端異常 (東京)</div>
                <div class="text-3xl font-bold mt-2 text-slate-400"><span>0</span> <span class="text-xs font-normal text-slate-400">組</span></div>
                <div class="flex gap-2 mt-2 text-[10px]">
                    <span class="px-1.5 py-0.5 bg-slate-800 text-slate-400 rounded">未達: 0</span>
                    <span class="px-1.5 py-0.5 bg-slate-800 text-slate-400 rounded">私網: 0</span>
                </div>
            </div>
        </div>

        <!-- 24小時巡檢健康指標通知橫幅 -->
        <div class="bg-[#122242] border border-blue-900/30 rounded-xl p-4 mb-6 flex items-center gap-3 text-sm">
            <span class="text-base">📊</span>
            <div class="flex-grow text-slate-300">
                <span class="font-medium text-white">24小時巡檢健康指標：</span> 
                <span class="text-emerald-400 text-xs bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20 ml-2">✓ 運作狀態極佳</span>
            </div>
        </div>

        <!-- 數據表格核心區塊 -->
        <div class="bg-[#0f1b35] border border-slate-800 rounded-xl shadow-2xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse align-middle">
                    <thead>
                        <tr class="bg-[#122242]/60 border-b border-slate-800 text-xs font-semibold text-slate-400 uppercase tracking-wider">
                            <th class="px-6 py-4">目標 IP</th>
                            <th class="px-6 py-4">元件</th>
                            <th class="px-6 py-4 text-center">跳數 (基準/差值)</th>
                            <th class="px-6 py-4">最終回應節點</th>
                            <th class="px-6 py-4">TW 台灣端路徑</th>
                            <th class="px-6 py-4">綜合判定</th>
                            <th class="px-6 py-4 text-center">探測日誌</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-800/60 bg-[#0f1b35]">
                        <!-- TABLE_ROWS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- 儀表板自動渲染元資料引擎 -->
    <script>
        if (window.__MONITOR_META__) {
            document.getElementById('txt-update-time').innerText = window.__MONITOR_META__.last_updated + " (UTC+8)";
            document.getElementById('card-total').innerText = window.__MONITOR_META__.total;
            document.getElementById('card-ok').innerText = window.__MONITOR_META__.ok;
            document.getElementById('card-tw-bad').innerText = window.__MONITOR_META__.bad;
        }
    </script>
</body>
</html>
