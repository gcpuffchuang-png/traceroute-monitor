<!doctype html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>路由巡檢與導入監控儀表板</title>
  <script>
    window.tailwind = {
      config: {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'bg-panel': '#0b0f19'
            },
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto']
            }
          }
        }
      }
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    .panel-border { box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset, 0 6px 30px rgba(2,6,23,0.6); border:1px solid rgba(255,255,255,0.04); backdrop-filter: blur(6px); }
    .frost { background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); }
    .ip-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", "Courier New", monospace; }
  </style>
</head>
<body class="bg-bg-panel text-slate-200 antialiased min-h-screen font-sans">
  <div class="max-w-7xl mx-auto px-6 py-8">
    <!-- Header -->
    <header class="flex items-start justify-between mb-8">
      <div class="flex items-start gap-6">
        <div class="flex flex-col">
          <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight leading-tight text-transparent bg-clip-text" style="background-image: linear-gradient(90deg,#06b6d4,#16a085);">
            Internet 路由巡檢與導入監控儀表板
          </h1>
          <div class="mt-2 flex gap-4 text-sm text-slate-300/80">
            <div class="flex flex-col">
              <span class="text-xs text-slate-400 uppercase">探測來源</span>
              <span class="text-sm">Taiwan 探針</span>
            </div>
            <div class="flex flex-col">
              <span class="text-xs text-slate-400 uppercase">巡檢週期</span>
              <span class="text-sm">每 30 分鐘自動 Traceroute</span>
            </div>
            <div class="flex flex-col">
              <span class="text-xs text-slate-400 uppercase">畫面狀態</span>
              <span class="text-sm inline-flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400 shadow-sm"></span>
                運作中
              </span>
            </div>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-4">
        <div class="text-xs text-slate-400 mr-2">最後更新</div>
        <div id="lastUpdated" class="text-sm text-slate-300">--</div>

        <button id="refreshBtn" class="ml-4 inline-flex items-center gap-2 px-4 py-2 rounded-md bg-blue-600 hover:bg-blue-500 active:scale-95 transition transform shadow-sm panel-border" title="手動刷新畫面">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h5M20 20v-5h-5M5.5 18A8.5 8.5 0 0118 5.5" />
          </svg>
          <span class="text-sm font-medium text-white">手動刷新畫面</span>
        </button>
      </div>
    </header>

    <!-- Stats cards -->
    <section class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
      <div class="panel-border frost p-4 rounded-xl flex items-center justify-between">
        <div>
          <div class="text-sm text-slate-300/80">監控目標總數</div>
          <div id="stat_total" class="mt-1 text-2xl md:text-3xl font-extrabold">--</div>
        </div>
        <div class="text-slate-400 text-sm">詳細 ›</div>
      </div>

      <div class="panel-border frost p-4 rounded-xl flex items-center justify-between">
        <div>
          <div class="text-sm text-slate-300/80">正常連通</div>
          <div id="stat_ok" class="mt-1 text-2xl md:text-3xl font-extrabold text-emerald-400">--</div>
        </div>
        <div class="text-slate-400 text-sm">良好</div>
      </div>

      <div class="panel-border frost p-4 rounded-xl flex items-center justify-between">
        <div>
          <div class="text-sm text-slate-300/80">異常 / 導入中</div>
          <div id="stat_bad" class="mt-1 text-2xl md:text-3xl font-extrabold text-slate-400">--</div>
        </div>
        <div class="text-slate-400 text-sm">無</div>
      </div>
    </section>

    <!-- Table -->
    <section class="panel-border rounded-2xl overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-700/30 bg-gradient-to-b from-transparent to-black/10">
        <div class="flex items-center justify-between">
          <h2 class="text-lg font-semibold text-slate-100">核心數據</h2>
          <div class="text-sm text-slate-400">深色表格 · 具有邊框與懸停效果</div>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-slate-700 text-sm">
          <thead class="bg-slate-900/60">
            <tr class="text-slate-300/90">
              <th class="px-4 py-3 text-left">目標IP/所屬網段</th>
              <th class="px-4 py-3 text-left">元件</th>
              <th class="px-4 py-3 text-center">跳數(基準/差值)</th>
              <th class="px-4 py-3 text-left">最終回應節點</th>
              <th class="px-4 py-3 text-left">是否抵達BR/EPG</th>
              <th class="px-4 py-3 text-left">路由狀態摘要</th>
              <th class="px-4 py-3 text-center">判定</th>
              <th class="px-4 py-3 text-center">路由日誌</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="bg-slate-900/40 divide-y divide-slate-700">
            <!-- TABLE_ROWS -->
          </tbody>
        </table>
      </div>

      <div class="px-6 py-4 border-t border-slate-700/30 bg-slate-900/20 text-sm text-slate-400" id="tableFooter">
        顯示 -- / -- 筆
      </div>
    </section>

    <footer class="mt-8 text-xs text-slate-500">
      註：資料由後端排程產生；「查看」按鈕可連接詳細路由日誌。
    </footer>
  </div>

  <script>
    // 小工具：當頁面由腳本寫入後可用 JS 更新統計數字 (若腳本有寫入相應 meta 資訊)
    const lastUpdatedMeta = document.getElementById('lastUpdated');
    if (window.__MONITOR_META__) {
      lastUpdatedMeta.textContent = window.__MONITOR_META__.last_updated || '--';
      document.getElementById('stat_total').textContent = window.__MONITOR_META__.total || '--';
      document.getElementById('stat_ok').textContent = window.__MONITOR_META__.ok || '--';
      document.getElementById('stat_bad').textContent = window.__MONITOR_META__.bad || '--';
      document.getElementById('tableFooter').textContent = `顯示 1-${window.__MONITOR_META__.total || '--'} / ${window.__MONITOR_META__.total || '--'} 筆`;
    }
    // Refresh button (client-side only) - 重新載入頁面
    document.getElementById('refreshBtn').addEventListener('click', ()=> location.reload());
  </script>
</body>
</html>
